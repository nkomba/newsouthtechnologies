<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="font-family: 'Inter', sans-serif;">
  <defs>
    <!-- Gradients -->
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </radialGradient>
    
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gear Teeth Path -->
    <path id="gearTeeth" d="M0,-40 L10,-40 L10,-30 L15,-30 L15,-20 L0,-20 L-15,-20 L-15,-30 L-10,-30 L-10,-40 Z" transform="translate(0,0)" fill="none" stroke="#0D9488" stroke-width="2"/>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#F8FAFC"/>

  <!-- Title Group -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">New South Technologies</text>
  <text x="400" y="65" text-anchor="middle" font-size="18" font-weight="500" fill="#475569">Governed Agility Framework™ (NS-T-GAF)</text>

  <!-- GROUP 1: Outer Orbit (Strategic Level) -->
  <g transform="translate(400, 300)">
    <circle r="280" fill="none" stroke="#94A3B8" stroke-width="4" stroke-dasharray="10,5" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="60s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Strategy Labels -->
    <text x="0" y="-260" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">STRATEGIC ORBIT</text>
    
    <!-- Budget Fluidity -->
    <circle cx="240" cy="150" r="60" fill="rgba(255,255,255,0.9)" stroke="#64748B" stroke-width="2"/>
    <text x="240" y="155" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">FUNDING</text>
    <text x="240" y="170" text-anchor="middle" font-size="9" fill="#475569">Fluid Buckets</text>

    <!-- Executive Council -->
    <circle cx="-240" cy="150" r="60" fill="rgba(255,255,255,0.9)" stroke="#64748B" stroke-width="2"/>
    <text x="-240" y="155" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">EXEC COUNCIL</text>
    <text x="-240" y="170" text-anchor="middle" font-size="9" fill="#475569">Risk Decisions</text>

    <!-- Acquisition -->
    <circle cx="0" cy="250" r="60" fill="rgba(255,255,255,0.9)" stroke="#64748B" stroke-width="2"/>
    <text x="0" y="255" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">ACQUISITION</text>
    <text x="0" y="270" text-anchor="middle" font-size="9" fill="#475569">Deliverable-Based</text>
  </g>

  <!-- GROUP 2: Middle Ring (Compliance Shield) -->
  <g transform="translate(400, 300)">
    <circle r="220" fill="none" stroke="#F59E0B" stroke-width="12" stroke-opacity="0.3" stroke-dasharray="20,10">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle r="210" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.5"/>

    <!-- Shield Labels -->
    <text x="0" y="-200" text-anchor="middle" font-size="16" font-weight="600" fill="#D97706">COMPLIANCE SHIELD</text>
    
    <!-- Key Controls -->
    <rect x="-120" y="-100" width="80" height="40" rx="5" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="-80" y="-75" text-anchor="middle" font-size="10" font-weight="600" fill="#B45309">CONTROLS</text>
    
    <rect x="40" y="-100" width="80" height="40" rx="5" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="80" y="-75" text-anchor="middle" font-size="10" font-weight="600" fill="#B45309">AUTO-EVIDENCE</text>
    
    <rect x="-80" y="120" width="80" height="40" rx="5" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="-40" y="145" text-anchor="middle" font-size="10" font-weight="600" fill="#B45309">MONITORING</text>
  </g>

  <!-- GROUP 3: Inner Ring (Agile Engine) -->
  <g transform="translate(400, 300)">
    <!-- Gear Circle -->
    <circle r="160" fill="url(#gearGrad)" stroke="#CBD5E1" stroke-width="4"/>
    
    <!-- Gear Teeth (Visual only) -->
    <g transform="rotate(0)">
      <use href="#gearTeeth" transform="rotate(0 0 0) translate(0, -170)"/>
      <use href="#gearTeeth" transform="rotate(72 0 0) translate(0, -170)"/>
      <use href="#gearTeeth" transform="rotate(144 0 0) translate(0, -170)"/>
      <use href="#gearTeeth" transform="rotate(216 0 0) translate(0, -170)"/>
      <use href="#gearTeeth" transform="rotate(288 0 0) translate(0, -170)"/>
    </g>

    <!-- Process Steps -->
    <text x="0" y="-140" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">AGILE ENGINE</text>
    
    <!-- Step 1: Plan -->
    <circle cx="-110" cy="-80" r="35" fill="#0D9488" stroke="#FFF" stroke-width="2"/>
    <text x="-110" y="-85" text-anchor="middle" font-size="10" font-weight="700" fill="#FFF">PLAN</text>
    <text x="-110" y="-72" text-anchor="middle" font-size="8" fill="#E0F2FE">NIST Mapping</text>

    <!-- Step 2: Build -->
    <circle cx="0" cy="-120" r="35" fill="#0D9488" stroke="#FFF" stroke-width="2"/>
    <text x="0" y="-125" text-anchor="middle" font-size="10" font-weight="700" fill="#FFF">BUILD</text>
    <text x="0" y="-112" text-anchor="middle" font-size="8" fill="#E0F2FE">Policy-as-Code</text>

    <!-- Step 3: Test -->
    <circle cx="110" cy="-80" r="35" fill="#0D9488" stroke="#FFF" stroke-width="2"/>
    <text x="110" y="-85" text-anchor="middle" font-size="10" font-weight="700" fill="#FFF">TEST</text>
    <text x="110" y="-72" text-anchor="middle" font-size="8" fill="#E0F2FE">Auto-Scans</text>

    <!-- Step 4: Review -->
    <circle cx="110" cy="40" r="35" fill="#0D9488" stroke="#FFF" stroke-width="2"/>
    <text x="110" y="35" text-anchor="middle" font-size="10" font-weight="700" fill="#FFF">REVIEW</text>
    <text x="110" y="48" text-anchor="middle" font-size="8" fill="#E0F2FE">ISSO Sign-off</text>

    <!-- Step 5: Deploy -->
    <circle cx="-110" cy="40" r="35" fill="#0D9488" stroke="#FFF" stroke-width="2"/>
    <text x="-110" y="35" text-anchor="middle" font-size="10" font-weight="700" fill="#FFF">DEPLOY</text>
    <text x="-110" y="48" text-anchor="middle" font-size="8" fill="#E0F2FE">Incremental</text>

    <!-- ISSO Badge -->
    <rect x="-160" y="-100" width="50" height="25" rx="4" fill="#F59E0B" stroke="#FFF" stroke-width="2"/>
    <text x="-135" y="-84" text-anchor="middle" font-size="10" font-weight="700" fill="#FFF">ISSO</text>
  </g>

  <!-- GROUP 4: Central Core (Mission) -->
  <g transform="translate(400, 300)">
    <circle r="80" fill="url(#coreGrad)" filter="url(#glow)"/>
    <text x="0" y="-10" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">MISSION</text>
    <text x="0" y="10" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">VALUE</text>
    
    <!-- Pulse Animation -->
    <circle r="80" fill="none" stroke="#FFF" stroke-width="2" opacity="0.8">
      <animate attributeName="r" from="80" to="95" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.8" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Feedback Loops (Arrows) -->
  <g stroke="#0D9488" stroke-width="2" marker-end="url(#arrowhead)">
    <!-- Loop 1: Inner to Middle -->
    <path d="M0,140 Q50,160 180,180" fill="none" stroke="#0D9488" opacity="0.6">
       <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1s" repeatCount="indefinite"/>
    </path>
    <!-- Loop 2: Middle to Outer -->
    <path d="M220,180 Q260,200 240,250" fill="none" stroke="#0D9488" opacity="0.6"/>
    <!-- Loop 3: Outer to Inner -->
    <path d="M0,260 Q-50,220 -160,140" fill="none" stroke="#0D9488" opacity="0.6"/>
  </g>

  <!-- Arrow Marker Definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0D9488"/>
    </marker>
  </defs>

  <!-- Legend / Footer -->
  <g transform="translate(400, 580)">
    <line x1="-200" y1="0" x2="200" y2="0" stroke="#CBD5E1" stroke-width="1"/>
    <text x="0" y="20" text-anchor="middle" font-size="10" fill="#64748B">
      "Compliance is not a phase gate; it is the engine of delivery." — New South Technologies
    </text>
  </g>
</svg>